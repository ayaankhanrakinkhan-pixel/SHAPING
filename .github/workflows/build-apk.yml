name: Build SHAPING APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SHAPING_V2_Android_Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q SHAPING_V2_Android_Project.zip -d extracted

      - name: Build APK
        run: |
          cd extracted/SHAPING_V2
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: SHAPING-APK
          path: extracted/SHAPING_V2/app/build/outputs/apk/debug/app-debug.apk
